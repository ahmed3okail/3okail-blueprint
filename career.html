function lu(n){return '<svg class="leaf-ic" viewBox="0 0 24 24" aria-hidden="true">'+LU[n]+'</svg>'}
var wSel=0;
function renderWBS(){
  var L=S.lang, s=wbs[wSel], h='<div class="wbs-root"><div class="wbs-node"><code>0.0</code>'+esc(t('wbsRoot'))+'</div></div><div class="wbs-stem"></div><div class="wbs-l1">';
  wbs.forEach(function(w,i){h+='<div><button type="button" class="wbs-node'+(i===wSel?' sel':'')+'" data-w="'+i+'"><code>'+w.code+'</code>'+esc(w.n[L])+'</button></div>'});
  h+='</div><div class="wbs-leaves"><h3><span class="mono" style="color:var(--accent)">'+s.code+'</span> '+esc(s.n[L])+'</h3><div class="leaf-grid">'+
    s.items[L].map(function(it,j){return '<div class="leaf"><code>'+s.code.charAt(0)+'.'+(j+1)+'</code>'+(s.ic?S.toolIcon(s.ic[j]):(s.li?lu(s.li[j]):''))+'<span>'+esc(it)+'</span></div>'}).join('')+'</div></div>';
  $('wbs').innerHTML=h;
}
$('wbs').addEventListener('click',function(ev){var b=ev.target.closest('[data-w]');if(!b)return;wSel=+b.getAttribute('data-w');renderWBS()});

var trainSeen=false;
function fillTrain(){document.querySelectorAll('#train .tr-bar span').forEach(function(s){s.style.width=s.getAttribute('data-w')+'%'})}
function renderTrain(){
  $('train').innerHTML=t('tr').map(function(r){return '<div class="tr-row"><div class="tr-name">'+esc(r[0])+'<small>'+esc(r[1])+'</small></div><div class="tr-bar"><span data-w="'+Math.max(r[2]/74*100,14).toFixed(1)+'">'+r[2]+t('hrs')+'</span></div></div>'}).join('')+
    '<div class="langs"><span class="chip">'+esc(t('langsT'))+'</span></div>';
  if(trainSeen)requestAnimationFrame(fillTrain);
}
S.init({T:T,title:{en:'Career',ar:'المسيرة'},render:function(){renderGantt();renderWBS();renderTrain()},onReveal:function(el){if(el.id==='train'){trainSeen=true;fillTrain()}}});
