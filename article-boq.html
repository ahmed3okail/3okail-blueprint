(function(){"use strict";var S=window.Site;
var T={"en": {"aT": "From BOQ to tender schedule in Primavera P6", "aBody": "<p>A tender schedule has two jobs: show the client that you understand the project and can finish on time, and give your own management a realistic cash-flow forecast. Both come from the same place: the bill of quantities (BOQ).</p>\n<h2>1. Read the tender documents first</h2>\n<p>Before opening P6, collect the contract duration, the key dates and milestones, access and phasing constraints, working days and holidays, and any required schedule format. These become the frame everything else must fit into.</p>\n<h2>2. Build the WBS from how the work will be done</h2>\n<p>The BOQ is organised by trade; the site is built by area and level. I build the WBS as Project → Zone or Building → Level → Trade. Each BOQ item is then mapped to one or more WBS elements. This mapping is the most important step, because it is what lets cost follow the schedule.</p>\n<h2>3. Turn BOQ items into activities</h2>\n<p>Not every BOQ line deserves an activity. Group items that are executed together (for example formwork, reinforcement and concrete for one slab), and split items that happen in different places or times. Aim for activities between one and four weeks long, so progress can be measured.</p>\n<h2>4. Estimate durations from quantities</h2>\n<p><b>Duration = quantity ÷ (crew output per day × number of crews).</b> Use production rates from your company's history where you have them. Then check the result against experience: a duration that looks too short usually is.</p>\n<h2>5. Add logic, calendars and constraints</h2>\n<p>Link activities with real logic: structure before finishes, rough-in before closing walls, curing times as lags. Every activity needs a predecessor and a successor. Assign calendars for working days and holidays, and use as few hard constraints as possible, because they hide the real critical path.</p>\n<h2>6. Load the cost</h2>\n<p>Assign each activity the value of its BOQ items (quantity × rate). In P6 this can be done with an expense or a resource. Check that the total of all activities equals the BOQ total; a gap means items were missed or counted twice.</p>\n<h2>7. Check the S-curve and the critical path</h2>\n<p>Run the schedule and look at the S-curve. A healthy curve starts slowly during mobilisation, rises steeply during structure and finishes, and flattens at handover. A straight line, or a big jump in one month, means the cost loading or the logic needs work. Finally, check that the critical path makes sense and that the finish meets the contract duration with some float for risk.</p>\n<h2>What the client sees</h2>\n<p>A summary bar chart by area and trade, the key milestones, the S-curve and a short method statement explaining the sequence. Clear and short beats long and detailed at tender stage.</p>", "meta": "Scheduling", "read": "min read", "by": "Ahmed AbuOkail", "all": "← All articles", "next": "Next article", "nT": "Time Impact Analysis, step by step: how to prove an EOT", "contact": "Questions about your project? Contact me", "tl": "Try it: tender schedule lab →"}, "ar": {"aT": "من جدول الكميات لبرنامج المناقصة على Primavera P6", "aBody": "<p>برنامج المناقصة ليه وظيفتين: يوضّح للعميل إنك فاهم المشروع وتقدر تخلّص في الميعاد، ويدي الإدارة عندك توقع واقعي للتدفق النقدي. والاتنين بيطلعوا من نفس المكان: جدول الكميات (BOQ).</p>\n<h2>1. اقرا مستندات المناقصة الأول</h2>\n<p>قبل ما تفتح P6، اجمع مدة العقد، والتواريخ والمعالم الأساسية، وقيود تسليم المواقع والمراحل، وأيام الشغل والإجازات، وأي شكل مطلوب للبرنامج. دي الإطار اللي كل حاجة لازم تتحط جواه.</p>\n<h2>2. ابنِ الـ WBS حسب طريقة التنفيذ</h2>\n<p>جدول الكميات متقسم بالتخصص، لكن الموقع بيتبني بالمنطقة والدور. فأنا ببني الـ WBS كده: المشروع، وبعده المنطقة أو المبنى، وبعده الدور، وبعده التخصص. وبعدين كل بند في جدول الكميات بيترتبط بعنصر أو أكتر في الـ WBS. والربط ده هو أهم خطوة، لأنه اللي بيخلي التكلفة تمشي مع البرنامج.</p>\n<h2>3. حوّل البنود لأنشطة</h2>\n<p>مش كل سطر في جدول الكميات محتاج نشاط. اجمع البنود اللي بتتنفذ مع بعض (زي الشدات والحديد والخرسانة لبلاطة واحدة)، وافصل البنود اللي بتتنفذ في أماكن أو أوقات مختلفة. وخلي الأنشطة ما بين أسبوع و4 أسابيع، علشان التقدم يتقاس.</p>\n<h2>4. احسب المدد من الكميات</h2>\n<p><b>المدة = الكمية ÷ (إنتاجية الطاقم في اليوم × عدد الأطقم).</b> استخدم معدلات إنتاج من تاريخ شركتك لو متاحة. وبعدين راجع النتيجة بخبرتك: المدة اللي شكلها قصيرة زيادة، غالباً فعلاً قصيرة زيادة.</p>\n<h2>5. ضيف العلاقات والتقويمات والقيود</h2>\n<p>اربط الأنشطة بعلاقات حقيقية: الهيكل قبل التشطيبات، والتأسيس قبل قفل الحوائط، ومدد المعالجة كـ Lag. كل نشاط لازم يكون ليه نشاط قبله ونشاط بعده. وحدّد تقويمات لأيام الشغل والإجازات، وقلّل القيود الثابتة على قد ما تقدر، لأنها بتخبي المسار الحرج الحقيقي.</p>\n<h2>6. حمّل التكلفة</h2>\n<p>ادّي كل نشاط قيمة البنود المرتبطة بيه (الكمية × الفئة). وعلى P6 ده ممكن يتعمل بـ Expense أو بمورد. واتأكد إن إجمالي كل الأنشطة بيساوي إجمالي جدول الكميات؛ أي فرق معناه إن فيه بنود اتنست أو اتحسبت مرتين.</p>\n<h2>7. راجع منحنى S والمسار الحرج</h2>\n<p>احسب البرنامج وبص على منحنى S. المنحنى السليم بيبدأ ببطء في فترة التجهيز، ويطلع بسرعة في الهيكل والتشطيبات، ويهدى عند التسليم. خط مستقيم، أو قفزة كبيرة في شهر واحد، معناه إن تحميل التكلفة أو العلاقات محتاجين مراجعة. وفي الآخر، اتأكد إن المسار الحرج منطقي، وإن الإنهاء جوه مدة العقد مع فائض بسيط للمخاطر.</p>\n<h2>اللي العميل بيشوفه</h2>\n<p>برنامج ملخص بالمناطق والتخصصات، والمعالم الأساسية، ومنحنى S، ووصف مختصر لطريقة التنفيذ يشرح التسلسل. في مرحلة المناقصة، الواضح والمختصر أحسن من الطويل والتفصيلي.</p>", "meta": "الجدولة", "read": "دقائق قراءة", "by": "أحمد أبوعقيل", "all": "→ كل المقالات", "next": "المقال التالي", "nT": "تحليل الأثر الزمني خطوة بخطوة: إزاي تثبت استحقاق تمديد المدة", "contact": "عندك سؤال عن مشروعك؟ تواصل معي", "tl": "← جرّبها: معمل برنامج المناقصة"}};
S.init({T:T,title:{en:"From BOQ to tender schedule in Primavera P6",ar:"من جدول الكميات لبرنامج المناقصة على Primavera P6"}});})();
