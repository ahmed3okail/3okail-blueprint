(function(){"use strict";var S=window.Site;
var T={"en": {"aT": "Time Impact Analysis, step by step: how to prove an EOT", "aBody": "<p>An Extension of Time (EOT) is not granted because a delay happened. It is granted because you can show, with the schedule, that a specific event pushed the completion date and that the contractor was not responsible for it. Time Impact Analysis (TIA) is the most common way to show that, and it is the method the Society of Construction Law Delay and Disruption Protocol recommends for prospective analysis.</p>\n<h2>1. Start from an accepted programme</h2>\n<p>TIA only works on a schedule both parties trust. Take the latest accepted programme update just before the delay event: the baseline or the last approved monthly update. Check that it has complete logic (no open ends), realistic durations, and a data date before the event. If the base programme is weak, the whole claim is weak.</p>\n<h2>2. Define the delay event precisely</h2>\n<p>Write down what happened, when it started, when it ended and who caused it: late drawings, a variation, late site access, an instruction to stop work. Attach the records: letters, RFIs, minutes of meetings, site diaries and photos. Under FIDIC, remember to send the notice within 28 days of becoming aware of the event, or the entitlement may be lost.</p>\n<h2>3. Build the fragnet</h2>\n<p>A fragnet is a small network of activities that models the event. For late drawings, for example: \"Drawing issued late\" (the waiting period), \"Review and resubmit shop drawings\", then the affected construction activity. Link the fragnet into the schedule with real logic, at the point where the event touches the work.</p>\n<h2>4. Run the schedule and compare</h2>\n<p>Schedule the impacted programme in Primavera P6 and compare its completion date with the unimpacted one. Three things can happen:</p>\n<ul>\n<li><b>The finish moves:</b> the event sat on the critical path or consumed all the float. The difference is the time impact.</li>\n<li><b>The finish does not move:</b> the event was absorbed by float. No EOT is due, even though the activity was delayed.</li>\n<li><b>Part of it is absorbed:</b> only the days beyond the available float move the finish.</li>\n</ul>\n<p>You can try all three cases in my <a href=\"delay.html\">delay analysis lab</a>.</p>\n<h2>5. Classify the delay</h2>\n<p>The time impact tells you how many days. Responsibility tells you what they are worth:</p>\n<ul>\n<li><b>Employer risk</b> (late drawings, variations, late access): excusable and compensable. Time and money.</li>\n<li><b>Neutral events</b> (force majeure, exceptionally adverse weather): excusable, not compensable. Time only.</li>\n<li><b>Contractor risk:</b> not excusable. No time; the contractor must recover or pay delay damages.</li>\n</ul>\n<p>If a contractor delay runs at the same time on another critical path (concurrent delay), expect the engineer to question the money, and often part of the time.</p>\n<h2>6. Write the claim so it can be checked</h2>\n<p>A good EOT submission lets the engineer repeat your work: the event and the contract clauses, the base programme used, the fragnet with its logic, the before and after dates, the classification, and the supporting records. Keep it short and traceable. A claim that can be checked quickly is a claim that gets approved.</p>\n<h2>Lessons from practice</h2>\n<p>Most claims are won or lost before the analysis starts: in the notices sent on time, in the quality of the updated programme, and in the site records. Keep them in order every week, not when the dispute begins.</p>", "meta": "Delay & claims", "read": "min read", "by": "Ahmed AbuOkail", "all": "← All articles", "next": "Next article", "nT": "SPI and CPI: what management really needs to know", "contact": "Questions about your project? Contact me"}, "ar": {"aT": "تحليل الأثر الزمني خطوة بخطوة: إزاي تثبت استحقاق تمديد المدة", "aBody": "<p>تمديد المدة (EOT) مش بيتمنح لمجرد إن فيه تأخير حصل. بيتمنح لما تقدر تثبت بالبرنامج الزمني إن حدث معين أخّر تاريخ الإنهاء، وإن المقاول مش مسؤول عنه. وتحليل الأثر الزمني (TIA) هو أشهر طريقة لإثبات ده، وهو الطريقة اللي بيوصي بيها بروتوكول التأخير والتعطيل الصادر عن جمعية قانون الإنشاءات (SCL) للتحليل المستقبلي.</p>\n<h2>1. ابدأ من برنامج معتمد</h2>\n<p>التحليل ده بيشتغل بس على برنامج الطرفين واثقين فيه. خد آخر تحديث معتمد قبل حدث التأخير مباشرة: البرنامج الأساسي أو آخر تحديث شهري معتمد. اتأكد إن العلاقات كاملة (مفيش أنشطة مفتوحة)، والمدد واقعية، وتاريخ البيانات قبل الحدث. لو البرنامج الأساسي ضعيف، المطالبة كلها هتبقى ضعيفة.</p>\n<h2>2. حدّد حدث التأخير بدقة</h2>\n<p>اكتب إيه اللي حصل، وبدأ إمتى، وخلص إمتى، ومين السبب: تأخر رسومات، أو أمر تغيير، أو تأخر تسليم الموقع، أو تعليمات بوقف العمل. وأرفق المستندات: الخطابات، وطلبات الاستفسار (RFI)، ومحاضر الاجتماعات، ويوميات الموقع، والصور. وفي عقود FIDIC، افتكر إن الإخطار لازم يتبعت خلال 28 يوم من علمك بالحدث، وإلا ممكن تفقد الحق.</p>\n<h2>3. ابنِ الـ Fragnet</h2>\n<p>الـ Fragnet هو شبكة صغيرة من الأنشطة بتمثّل الحدث. مثلاً في حالة تأخر الرسومات: نشاط \"تأخر إصدار الرسومات\" (فترة الانتظار)، وبعده \"مراجعة وإعادة تقديم الرسومات التنفيذية\"، وبعدها النشاط التنفيذي المتأثر. واربط الـ Fragnet بالبرنامج بعلاقات حقيقية، في النقطة اللي الحدث بيأثر فيها على الشغل.</p>\n<h2>4. شغّل البرنامج وقارن</h2>\n<p>احسب البرنامج المتأثر على Primavera P6، وقارن تاريخ الإنهاء بتاعه بتاريخ الإنهاء قبل الأثر. فيه 3 احتمالات:</p>\n<ul>\n<li><b>تاريخ الإنهاء اتحرك:</b> الحدث كان على المسار الحرج أو استهلك الفائض كله. الفرق هو الأثر الزمني.</li>\n<li><b>تاريخ الإنهاء ما اتحركش:</b> الفائض الزمني غطّى الحدث. مفيش تمديد مستحق، حتى لو النشاط نفسه اتأخر.</li>\n<li><b>الفائض غطّى جزء بس:</b> الأيام اللي زادت عن الفائض المتاح بس هي اللي بتأخر الإنهاء.</li>\n</ul>\n<p>تقدر تجرب الحالات التلاتة في <a href=\"delay.html\">أداة تحليل التأخير</a>.</p>\n<h2>5. صنّف التأخير</h2>\n<p>الأثر الزمني بيقولك كام يوم. والمسؤولية بتقولك قيمتهم إيه:</p>\n<ul>\n<li><b>مسؤولية المالك</b> (تأخر رسومات، أوامر تغيير، تأخر تسليم الموقع): يستحق مدة وتعويض. وقت وفلوس.</li>\n<li><b>أحداث محايدة</b> (قوة قاهرة، طقس استثنائي): يستحق مدة بس. وقت من غير فلوس.</li>\n<li><b>مسؤولية المقاول:</b> مفيش وقت ولا فلوس، والمقاول لازم يعوّض التأخير أو يدفع غرامات التأخير.</li>\n</ul>\n<p>ولو فيه تأخير من المقاول ماشي في نفس الوقت على مسار حرج تاني (تأخير متزامن)، توقّع إن المهندس هيعترض على الفلوس، وساعات على جزء من الوقت كمان.</p>\n<h2>6. اكتب المطالبة بشكل يتراجع بسهولة</h2>\n<p>المطالبة الكويسة بتخلي المهندس يقدر يعيد شغلك بنفسه: الحدث وبنود العقد، والبرنامج الأساسي المستخدم، والـ Fragnet بعلاقاته، والتواريخ قبل وبعد، والتصنيف، والمستندات الداعمة. خليها قصيرة وواضحة المصدر. المطالبة اللي بتتراجع بسرعة هي اللي بتتعتمد.</p>\n<h2>دروس من الشغل الفعلي</h2>\n<p>أغلب المطالبات بتتكسب أو بتضيع قبل ما التحليل يبدأ: في الإخطارات اللي اتبعتت في ميعادها، وفي جودة البرنامج المحدَّث، وفي سجلات الموقع. حافظ عليهم منظمين كل أسبوع، مش لما الخلاف يبدأ.</p>", "meta": "التأخير والمطالبات", "read": "دقائق قراءة", "by": "أحمد أبوعقيل", "all": "→ كل المقالات", "next": "المقال التالي", "nT": "SPI و CPI: إيه اللي الإدارة محتاجة تعرفه فعلاً", "contact": "عندك سؤال عن مشروعك؟ تواصل معي"}};
S.init({T:T,title:{en:"Time Impact Analysis, step by step: how to prove an EOT",ar:"تحليل الأثر الزمني خطوة بخطوة: إزاي تثبت استحقاق تمديد المدة"}});})();
</script>
