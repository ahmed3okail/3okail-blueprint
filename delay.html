<script src="assets/site.js?v=14"></script>
<script>
(function(){
"use strict";
var S=window.Site, $=S.$, esc=S.esc, t=S.t;
var T={
en:{tiaT:'Delay analysis lab', tiaP:'A mini Time Impact Analysis. Insert a delay event (fragnet) into the schedule and see whether it hits the critical path and what it entitles.',
 inAct:'Delay event hits activity', inDays:'Delay duration', inResp:'Responsibility', days:'d',
 resp:[['emp','Employer'],['neu','Neutral (force majeure)'],['con','Contractor']],
 tiaHint:'Red bars are critical. Grey lines show float. The hatched block is the delay fragnet; the red line is the new finish.',
 acts:{A:'Mobilization',B:'Excavation',C:'Foundations',D:'MEP rough-in',E:'Superstructure',F:'Finishes & handover'},
 rOrig:'Original finish', rNew:'Impacted finish', rDelay:'Project delay',
 eAbsorb:'Absorbed by float: the activity had {f} days of float (TF {f} → {r}). The {x}-day delay uses {x} of them, so the finish date doesn\'t move and no EOT is due.',
 eOver:'The activity had {f} days of float. The {x}-day delay uses all of it and pushes the finish by {d} days. ',
 eEmp:'Excusable and compensable: the contractor is entitled to an EOT of {d} days plus prolongation costs.',
 eNeu:'Excusable, non-compensable: an EOT of {d} days, with no additional cost.',
 eCon:'Non-excusable: no EOT. The contractor must recover {d} days or face delay damages.',
 eZero:'No delay event yet. Move the slider to test one.',
 mT:'Who carries the delay?', mP:'The three outcomes the lab can give, in short.',
 mx:[['Excusable · compensable','Caused by the employer (late drawings, variations, late access). Time and money.'],['Excusable · non-compensable','Caused by neutral events such as force majeure or exceptional weather. Time, no money.'],['Non-excusable','Caused by the contractor. No time, no money; delay damages may apply.']],
 goContact:'Need a delay claim? Contact me', goEvm:'← EVM lab'},
ar:{tiaT:'معمل تحليل التأخير', tiaP:'تحليل أثر زمني (TIA) مصغّر. أدخل حدث تأخير (Fragnet) في البرنامج وشوف هل يؤثر على المسار الحرج وإيه الاستحقاق.',
 inAct:'النشاط المتأثر بالتأخير', inDays:'مدة التأخير', inResp:'المسؤولية', days:' يوم',
 resp:[['emp','المالك'],['neu','محايد (قوة قاهرة)'],['con','المقاول']],
 tiaHint:'الأشرطة الحمراء على المسار الحرج. الخطوط الرمادية هي الفائض الزمني. الكتلة المخططة هي حدث التأخير، والخط الأحمر هو تاريخ الإنهاء الجديد.',
 acts:{A:'التجهيز والتعبئة',B:'الحفر',C:'الأساسات',D:'أعمال MEP الأولية',E:'الهيكل الخرساني',F:'التشطيبات والتسليم'},
 rOrig:'الإنهاء الأصلي', rNew:'الإنهاء بعد الأثر', rDelay:'تأخير المشروع',
 eAbsorb:'امتصه الفائض الزمني: النشاط كان عنده {f} يوم فائض (TF {f} → {r}). التأخير ({x} يوم) استهلك {x} يوم منهم، فتاريخ الإنهاء لا يتغير ولا يُستحق تمديد.',
 eOver:'النشاط كان عنده {f} يوم فائض. التأخير ({x} يوم) استهلكه كله وأخّر تاريخ الإنهاء {d} يوم. ',
 eEmp:'تأخير مُعذَر وقابل للتعويض: يستحق المقاول تمديد مدة {d} يوم بالإضافة إلى تكاليف إطالة المدة.',
 eNeu:'تأخير مُعذَر غير قابل للتعويض: تمديد مدة {d} يوم بدون تكاليف إضافية.',
 eCon:'تأخير غير مُعذَر: لا تمديد. على المقاول استدراك {d} يوم أو تطبيق غرامات التأخير.',
 eZero:'لا يوجد حدث تأخير بعد. حرّك المؤشر لتجربة حدث.',
 mT:'مين يتحمل التأخير؟', mP:'النتائج الثلاثة اللي ممكن يطلعها المعمل، باختصار.',
 mx:[['مُعذَر وقابل للتعويض','سببه المالك (تأخر الرسومات، أوامر التغيير، تأخر تسليم الموقع). وقت وفلوس.'],['مُعذَر غير قابل للتعويض','سببه أحداث محايدة زي القوة القاهرة أو الطقس الاستثنائي. وقت بدون فلوس.'],['غير مُعذَر','سببه المقاول. لا وقت ولا فلوس، وممكن تُطبّق غرامات التأخير.']],
 goContact:'محتاج مطالبة تأخير؟ تواصل معي', goEvm:'معمل EVM →'}};

var acts=[{id:'A',d:10,p:[]},{id:'B',d:20,p:['A']},{id:'C',d:25,p:['B']},{id:'D',d:30,p:['B']},{id:'E',d:40,p:['C']},{id:'F',d:30,p:['D','E']}];
var tAct='D', tResp='emp';
function cpm(extra){
  var es={},ef={},ls={},lf={},tf={};
  acts.forEach(function(a){es[a.id]=a.p.length?Math.max.apply(null,a.p.map(function(p){return ef[p]})):0;ef[a.id]=es[a.id]+a.d+(extra[a.id]||0)});
  var end=Math.max.apply(null,acts.map(function(a){return ef[a.id]}));
  acts.slice().reverse().forEach(function(a){var succ=acts.filter(function(s){return s.p.indexOf(a.id)>=0});lf[a.id]=succ.length?Math.min.apply(null,succ.map(function(s){return ls[s.id]})):end;ls[a.id]=lf[a.id]-a.d-(extra[a.id]||0)});
  acts.forEach(function(a){tf[a.id]=ls[a.id]-es[a.id]});
  return {es:es,ef:ef,tf:tf,end:end};
}
function renderTIAControls(){
  $('tAct').innerHTML=acts.map(function(a){return '<option value="'+a.id+'"'+(a.id===tAct?' selected':'')+'>'+a.id+' · '+esc(t('acts')[a.id])+' ('+a.d+t('days')+')</option>'}).join('');
  $('tResp').innerHTML=t('resp').map(function(r){return '<button type="button" data-r="'+r[0]+'" class="'+(tResp===r[0]?'on':'')+'">'+r[1]+'</button>'}).join('');
}
$('tAct').addEventListener('change',function(){tAct=this.value;renderTIA()});
$('tDays').addEventListener('input',renderTIA);
$('tResp').addEventListener('click',function(ev){var b=ev.target.closest('[data-r]');if(!b)return;tResp=b.getAttribute('data-r');renderTIAControls();renderTIA()});
function renderTIA(){
  var days=+$('tDays').value; $('oDays').textContent=days+t('days');
  var base=cpm({}), ex={}; ex[tAct]=days; var imp=cpm(ex), SC=190;
  function P(v){return (v/SC*100).toFixed(2)+'%'}
  var h='<div class="t-rows"><div class="t-axis"><div></div><div class="t-track">';
  for(var d=0;d<=180;d+=30)h+='<span class="t-tick" style="left:'+P(d)+'">'+d+'</span>';
  h+='</div></div>';
  acts.forEach(function(a){
    var crit=imp.tf[a.id]===0, es=imp.es[a.id], fr=(a.id===tAct&&days>0)?days:0;
    h+='<div class="t-row"><div class="nm">'+a.id+' · '+esc(t('acts')[a.id])+'<small>'+a.d+t('days')+(fr?' + '+fr+t('days'):'')+' · TF '+(base.tf[a.id]!==imp.tf[a.id]?base.tf[a.id]+' → '+imp.tf[a.id]:imp.tf[a.id])+'</small></div><div class="t-track">'+
      '<span class="t-line orig" style="left:'+P(base.end)+'"></span><span class="t-line new" style="left:'+P(imp.end)+'"></span>'+
      (fr?'<span class="t-frag" style="left:'+P(es)+';width:'+P(fr)+'"></span>':'')+
      '<span class="t-bar'+(crit?' crit':'')+'" style="left:'+P(es+fr)+';width:'+P(a.d)+'">'+a.id+'</span>'+
      (imp.tf[a.id]>0?'<span class="t-float" style="left:'+P(imp.ef[a.id])+';width:'+P(imp.tf[a.id])+'"></span>':'')+
      '</div></div>';
  });
  $('tiaChart').innerHTML=h+'</div>';
  var delay=imp.end-base.end;
  function box(l,v,bad){return '<div class="kpi'+(bad===null?'':(bad?' bad':' good'))+'"><small>'+l+'</small><b>'+v+'</b></div>'}
  $('tiaRes').innerHTML=box(t('rOrig'),base.end+t('days'),null)+box(t('rNew'),imp.end+t('days'),delay>0)+box(t('rDelay'),delay+t('days'),delay>0);
  var msg,cls;
  if(days===0){msg=t('eZero');cls='mix'}
  else if(delay===0){msg=t('eAbsorb').replace(/\{f\}/g,base.tf[tAct]).replace(/\{x\}/g,days).replace('{r}',imp.tf[tAct]);cls='good'}
  else{msg=(base.tf[tAct]>0?t('eOver').replace('{f}',base.tf[tAct]).replace('{x}',days).replace('{d}',delay):'')+t(tResp==='emp'?'eEmp':tResp==='neu'?'eNeu':'eCon').replace('{d}',delay);cls=tResp==='con'?'bad':(tResp==='emp'?'good':'mix')}
  $('tiaEnt').className='verdict '+cls; $('tiaEnt').textContent=msg;
}
function renderMx(){$('mx').innerHTML=t('mx').map(function(m,i){return '<div class="panel"><div class="no2">0'+(i+1)+'</div><h3>'+esc(m[0])+'</h3><p>'+esc(m[1])+'</p></div>'}).join('')}
S.init({T:T,title:{en:'Delay lab',ar:'معمل التأخير'},render:function(){renderTIAControls();renderTIA();renderMx()}});
})();
</script>
<script data-goatcounter="https://3okail-blueprint.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
