(function(){"use strict";var S=window.Site;
var T={"en": {"aT": "SPI and CPI: what management really needs to know", "aBody": "<p>Management rarely has time for a 40-page progress report. What they want to know is simple: are we on time, are we on budget, and where will we finish? Earned Value Management (EVM) answers all three with a few numbers, if you read them correctly.</p>\n<h2>The three numbers</h2>\n<ul>\n<li><b>Planned Value (PV):</b> the budgeted cost of the work that should have been done by today.</li>\n<li><b>Earned Value (EV):</b> the budgeted cost of the work actually done. This is progress expressed in money.</li>\n<li><b>Actual Cost (AC):</b> what the work done really cost.</li>\n</ul>\n<p>Everything else comes from these three. That is why the quality of EV matters most: if progress is measured badly, every index after it is wrong.</p>\n<h2>The two indices</h2>\n<p><b>SPI = EV ÷ PV.</b> Below 1.0 means less work was done than planned. An SPI of 0.90 means you produce 90% of the planned work rate.</p>\n<p><b>CPI = EV ÷ AC.</b> Below 1.0 means the work costs more than budgeted. A CPI of 0.92 means every pound spent produces 92 piastres of planned value.</p>\n<h2>Read them together</h2>\n<ul>\n<li><b>SPI &lt; 1 and CPI &lt; 1:</b> behind and over budget. The most serious case; look for productivity problems.</li>\n<li><b>SPI &lt; 1 and CPI ≥ 1:</b> behind but efficient. Often a resource or access problem; adding resources may fix it.</li>\n<li><b>SPI ≥ 1 and CPI &lt; 1:</b> ahead but expensive. Speed is being bought, possibly with overtime.</li>\n<li><b>Both ≥ 1:</b> healthy. Check that the baseline was not too loose.</li>\n</ul>\n<h2>The forecast management cares about</h2>\n<p><b>EAC = BAC ÷ CPI</b> gives the expected final cost if current efficiency continues. For time, a simple forecast divides the planned duration by SPI. Show the trend over several months, not one point: a CPI moving from 0.98 to 0.93 is a warning even before it looks bad.</p>\n<h2>Three traps</h2>\n<ul>\n<li><b>SPI drifts back to 1.0 near the end.</b> At completion EV equals PV by definition, so a late project still ends with SPI 1.0. Near the end, look at the critical path and the forecast finish date, not SPI alone.</li>\n<li><b>SPI ignores the critical path.</b> You can be ahead on non-critical work and behind on the activities that drive completion. A good SPI does not mean the finish date is safe.</li>\n<li><b>Optimistic percent complete.</b> If EV comes from guesses, the indices are fiction. Use measurable rules: quantities installed, milestones reached, or 0/50/100 for short activities.</li>\n</ul>\n<h2>What I put on the dashboard</h2>\n<p>One S-curve with PV, EV and AC; SPI and CPI with their trend; the forecast finish and EAC; and the five activities causing the most slippage. That is enough for a decision. You can play with these numbers in my <a href=\"evm.html\">EVM lab</a>.</p>", "meta": "Project controls", "read": "min read", "by": "Ahmed AbuOkail", "all": "← All articles", "next": "Next article", "nT": "From BOQ to tender schedule in Primavera P6", "contact": "Questions about your project? Contact me"}, "ar": {"aT": "SPI و CPI: إيه اللي الإدارة محتاجة تعرفه فعلاً", "aBody": "<p>الإدارة نادراً ما يكون عندها وقت لتقرير تقدم 40 صفحة. اللي عايزين يعرفوه بسيط: إحنا ماشيين في الميعاد؟ في حدود الميزانية؟ وهنخلص إمتى وبكام؟ وإدارة القيمة المكتسبة (EVM) بتجاوب على التلاتة بشوية أرقام، لو قريتها صح.</p>\n<h2>الأرقام التلاتة</h2>\n<ul>\n<li><b>القيمة المخططة (PV):</b> تكلفة الشغل اللي كان المفروض يخلص لحد النهارده حسب الميزانية.</li>\n<li><b>القيمة المكتسبة (EV):</b> تكلفة الشغل اللي خلص فعلاً حسب الميزانية. يعني التقدم متحوّل لفلوس.</li>\n<li><b>التكلفة الفعلية (AC):</b> الشغل اللي خلص ده تكلف فعلاً كام.</li>\n</ul>\n<p>كل حاجة تانية بتطلع من التلاتة دول. وعلشان كده دقة الـ EV هي الأهم: لو التقدم اتقاس غلط، كل المؤشرات اللي بعده هتطلع غلط.</p>\n<h2>المؤشرين</h2>\n<p><b dir=\"ltr\">SPI = EV ÷ PV</b>. أقل من 1.0 معناه إن الشغل اللي خلص أقل من المخطط. يعني SPI قيمته 0.90 معناه إنك بتنجز 90% من معدل الشغل المخطط.</p>\n<p><b dir=\"ltr\">CPI = EV ÷ AC</b>. أقل من 1.0 معناه إن الشغل بيتكلف أكتر من الميزانية. يعني CPI قيمته 0.92 معناه إن كل جنيه بيتصرف بيطلّع 92 قرش بس من القيمة المخططة.</p>\n<h2>اقراهم مع بعض</h2>\n<ul>\n<li><b>SPI أقل من 1 و CPI أقل من 1:</b> متأخر وفوق الميزانية. أخطر حالة، ودوّر على مشكلة في الإنتاجية.</li>\n<li><b>SPI أقل من 1 و CPI أكبر من أو يساوي 1:</b> متأخر بس كفء. غالباً مشكلة موارد أو تسليم مواقع، وزيادة الموارد ممكن تحلها.</li>\n<li><b>SPI أكبر من أو يساوي 1 و CPI أقل من 1:</b> سابق بس مكلّف. إنت بتشتري السرعة، ممكن بساعات إضافية.</li>\n<li><b>الاتنين أكبر من أو يساوي 1:</b> وضع سليم. بس اتأكد إن البرنامج الأساسي ما كانش مريح زيادة.</li>\n</ul>\n<h2>التوقع اللي الإدارة مهتمة بيه</h2>\n<p><b dir=\"ltr\">EAC = BAC ÷ CPI</b> بيديك التكلفة النهائية المتوقعة لو الكفاءة الحالية فضلت زي ما هي. وللوقت، فيه توقع بسيط بيقسم المدة المخططة على SPI. واعرض الاتجاه على كذا شهر مش نقطة واحدة: CPI بينزل من 0.98 لـ 0.93 ده إنذار حتى قبل ما شكله يبقى وحش.</p>\n<h2>تلات فخاخ</h2>\n<ul>\n<li><b>SPI بيرجع لـ 1.0 قرب النهاية.</b> عند الإنهاء الـ EV بيساوي الـ PV بالتعريف، فحتى المشروع المتأخر بيخلص بـ SPI قيمته 1.0. قرب النهاية بص على المسار الحرج وتاريخ الإنهاء المتوقع، مش على SPI لوحده.</li>\n<li><b>SPI مش بيشوف المسار الحرج.</b> ممكن تكون سابق في شغل مش حرج ومتأخر في الأنشطة اللي بتحدد الإنهاء. SPI كويس مش معناه إن تاريخ الإنهاء في أمان.</li>\n<li><b>نسب إنجاز متفائلة.</b> لو الـ EV جاي من تخمين، المؤشرات كلها خيال. استخدم قواعد قابلة للقياس: الكميات المنفذة، أو المعالم اللي اتحققت، أو 0/50/100 للأنشطة القصيرة.</li>\n</ul>\n<h2>اللي بحطه في لوحة المتابعة</h2>\n<p>منحنى S واحد فيه PV و EV و AC، و SPI و CPI مع اتجاههم، وتاريخ الإنهاء المتوقع و EAC، وأكتر 5 أنشطة مسببة للتأخير. ده كفاية لاتخاذ قرار. وتقدر تجرب الأرقام دي في <a href=\"evm.html\">معمل EVM</a>.</p>", "meta": "مراقبة المشروعات", "read": "دقائق قراءة", "by": "أحمد أبوعقيل", "all": "→ كل المقالات", "next": "المقال التالي", "nT": "من جدول الكميات لبرنامج المناقصة على Primavera P6", "contact": "عندك سؤال عن مشروعك؟ تواصل معي"}};
S.init({T:T,title:{en:"SPI and CPI: what management really needs to know",ar:"SPI و CPI: إيه اللي الإدارة محتاجة تعرفه فعلاً"}});})();
</script>
