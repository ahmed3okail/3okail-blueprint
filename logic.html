/* ---------- indexes ---------- */
var byId={}; A.forEach(function(a,i){byId[a[0]]={c:a[0],st:a[1],d:a[2],en:a[3],ar:a[4],i:i}});
var stIdx={}; ST.forEach(function(s,i){stIdx[s[0]]=i});
var P={},N={}; A.forEach(function(a){P[a[0]]=[];N[a[0]]=[]});
R.forEach(function(r){P[r[1]].push(r);N[r[0]].push(r)});
function nm(c){var a=byId[c];return a[S.lang]||a.en}
function stName(id){var s=ST[stIdx[id]];return S.lang==='ar'?s[2]:s[1]}
function dsName(id){var d=DS.filter(function(x){return x[0]===id})[0];return S.lang==='ar'?d[2]:d[1]}
function walk(c,map){var seen={},st=[c];while(st.length){var x=st.pop();map[x].forEach(function(r){var y=r[0]===x?r[1]:r[0];if(!seen[y]){seen[y]=1;st.push(y)}})}return Object.keys(seen).length}

/* ---------- state ---------- */
var cur='P20', mode=1, fSt='', fDs='', q='';
var h=(location.hash||'').slice(1).toUpperCase(); if(byId[h])cur=h;

/* logic token → {type, lag text} */
function pick(r){var l=r[2];if(typeof l==='string')return l;return l[mode]||l[1]||l[2]}
function parse(tok){var m=/^(FS|SS|FF|SF)(?:\+(.+))?$/.exec(tok);var ty=m[1],lg=m[2]||'';
  if(!lg)return {ty:ty,lag:'',n:0};
  var u='d',v=lg; if(/h$/.test(lg)){u='h';v=lg.slice(0,-1)}else if(/fl$/.test(lg)){u='fl';v=lg.slice(0,-2)}
  v=v.replace('-','–');
  var ar=S.lang==='ar', unit=u==='d'?(ar?' يوم':'d'):u==='h'?(ar?' ساعة':'h'):(ar?' دور':(v==='1'?' floor':' floors'));
  return {ty:ty,lag:'+'+v+unit,n:parseFloat(v)||0,u:u};}
function badge(r,big){var p=parse(pick(r));var multi=typeof r[2]!=='string';
  return '<span class="lg-rel '+p.ty.toLowerCase()+(big?' big':'')+'" dir="ltr"><b>'+p.ty+'</b>'+(p.lag?'<i>'+esc(p.lag)+'</i>':'')+'</span>'+(multi?'<span class="lg-opt" title="'+esc(t('opts'))+'">'+[0,1,2].map(function(k){return '<i class="'+(r[2][k]?'':'x ')+(k===mode||(!r[2][mode]&&k===(r[2][1]?1:2))?'on':'')+'"></i>'}).join('')+'</span>':'')}
function relTxt(r){var p=parse(pick(r));return p.ty+(p.lag?' '+p.lag:'')}

    var n=A.filter(function(a){return a[1]===s[0]}).length;
    return '<button type="button" class="lg-st'+(fSt===s[0]?' on':'')+(cs===s[0]?' here':'')+'" data-st="'+s[0]+'"><span class="n">'+(i<9?'0':'')+(i+1)+'</span><span>'+esc(S.lang==='ar'?s[2]:s[1])+'</span><small>'+n+'</small></button>'}).join('');
}

function renderList(){
  var qq=q.trim().toLowerCase(), html='', any=0;
  ST.forEach(function(s){
    if(fSt&&fSt!==s[0])return;
    var items=A.filter(function(a){return a[1]===s[0]&&(!fDs||a[2]===fDs)&&(!qq||(a[0]+' '+a[3]+' '+a[4]).toLowerCase().indexOf(qq)>=0)});
    if(!items.length)return; any=1;
    html+='<div class="lg-grp">'+esc(S.lang==='ar'?s[2]:s[1])+'</div>'+items.map(function(a){
      return '<button type="button" class="lg-item lg-d-'+a[2].toLowerCase()+(a[0]===cur?' on':'')+'" data-go="'+a[0]+'"><code>'+a[0]+'</code><span>'+esc(nm(a[0]))+'</span><i class="lg-dot"></i></button>'}).join('');
  });
  $('list').innerHTML=any?html:'<p class="hint" style="padding:10px 4px">'+esc(t('noRes'))+'</p>';
}
function node(r,side){
  var c=side==='p'?r[0]:r[1], a=byId[c];
  return '<button type="button" class="lg-node lg-d-'+a.d.toLowerCase()+(r[3]?' crit':'')+'" data-go="'+c+'" data-k="'+c+'">'+
    '<span class="lg-nt">'+badge(r)+(r[3]?'<span class="lg-crit">'+esc(t('crit'))+'</span>':'')+'</span>'+
    '<span class="lg-nn"><code>'+c+'</code>'+esc(nm(c))+'</span>'+
    '<span class="lg-why">'+esc(S.lang==='ar'?r[5]:r[4])+'</span>'+
    (a.st!==byId[cur].st?'<span class="lg-from">'+esc(stName(a.st))+'</span>':'')+'</button>';
}
function renderMain(){
  var a=byId[cur], ps=P[cur], ns=N[cur];
  $('head').innerHTML='<div class="lg-tags"><span class="lg-code">'+a.c+'</span><span class="chip">'+esc(stName(a.st))+'</span><span class="chip lg-dchip lg-d-'+a.d.toLowerCase()+'"><i class="lg-dot"></i>'+esc(dsName(a.d))+'</span></div>'+
    '<h2>'+esc(nm(cur))+'</h2>'+
    '<div class="kpis lg-k">'+[[t('preds'),ps.length],[t('succs'),ns.length],[t('up'),walk(cur,P)],[t('down'),walk(cur,N)]].map(function(k){return '<div class="kpi"><small>'+esc(k[0])+'</small><b>'+k[1]+'</b></div>'}).join('')+'</div>';
  $('preds').innerHTML=ps.length?ps.map(function(r){return node(r,'p')}).join(''):'<p class="lg-none">'+esc(t('none'))+'</p>';
  $('succs').innerHTML=ns.length?ns.map(function(r){return node(r,'s')}).join(''):'<p class="lg-none">'+esc(t('none'))+'</p>';
  $('mid').innerHTML='<div class="lg-center lg-d-'+a.d.toLowerCase()+'" id="ctr"><span class="lg-cc">'+a.c+'</span><b>'+esc(nm(cur))+'</b><small>'+esc(stName(a.st))+'</small></div>';
  $('legend').innerHTML=t('legend').map(function(l){return '<span><i class="lg-sw '+l[0].toLowerCase()+'"></i><b dir="ltr">'+l[0]+'</b> '+esc(l[1])+'</span>'}).join('')+'<span><i class="lg-sw crit"></i>'+esc(t('crit2'))+'</span>';
  /* workflow strip */
  var si=stIdx[a.st], flow=A.filter(function(x){return x[1]===a.st});
  $('wfNo').setAttribute('data-en','STAGE '+(si<9?'0':'')+(si+1)); $('wfNo').textContent=(S.lang==='ar'?'المرحلة ':'STAGE ')+(si<9?'0':'')+(si+1);
  $('wfT').textContent=stName(a.st);
  var link={}; ps.forEach(function(r){link[r[0]]='p'}); ns.forEach(function(r){link[r[1]]='s'});
  $('flow').innerHTML=flow.map(function(x,i){var k=x[0]===cur?'on':(link[x[0]]==='p'?'pr':link[x[0]]==='s'?'su':'');
    return '<li><button type="button" class="lg-step lg-d-'+x[2].toLowerCase()+' '+k+'" data-go="'+x[0]+'"><span class="n">'+(i+1)+'</span><code>'+x[0]+'</code><span class="t">'+esc(nm(x[0]))+'</span></button></li>'}).join('');
  /* table */
  var rows=ps.concat(ns);
  $('tbl').innerHTML='<thead><tr><th>'+esc(t('thPred'))+'</th><th>'+esc(t('thSucc'))+'</th><th>'+esc(t('thRel'))+'</th><th>'+esc(t('thWhy'))+'</th></tr></thead><tbody>'+rows.map(function(r){
    return '<tr'+(r[0]===cur||r[1]===cur?'':'')+'><td><code>'+r[0]+'</code> '+esc(nm(r[0]))+'</td><td><code>'+r[1]+'</code> '+esc(nm(r[1]))+'</td><td class="rel">'+badge(r)+(r[3]?' <span class="lg-crit">'+esc(t('crit'))+'</span>':'')+'</td><td class="why">'+esc(S.lang==='ar'?r[5]:r[4])+'</td></tr>'}).join('')+'</tbody>';
  requestAnimationFrame(wires);
}
/* connector lines between nodes and the center card */
function wires(){
  var svg=$('wires'), box=$('net').getBoundingClientRect(), c=$('ctr'); if(!c)return;
  var cr=c.getBoundingClientRect(), out='';
  svg.setAttribute('width',box.width); svg.setAttribute('height',box.height); svg.setAttribute('viewBox','0 0 '+box.width+' '+box.height);
  function X(v){return v-box.left} function Y(v){return v-box.top}
  function path(nr,isPred,cls){
    var stacked=nr.right>cr.left+4&&nr.left<cr.right-4, d;
    if(stacked){ /* mobile: vertical */
      var x1=X(nr.left+nr.width/2), x2=X(cr.left+cr.width/2), y1,y2;
      if(isPred){y1=Y(nr.bottom);y2=Y(cr.top)}else{y1=Y(cr.bottom);y2=Y(nr.top)}
      var my=(y1+y2)/2; d='M'+x1+' '+y1+' C'+x1+' '+my+','+x2+' '+my+','+x2+' '+(y2-7);
    }else{
      var nLeft=nr.right<=cr.left+4, ny=Y(nr.top+Math.min(nr.height/2,34)), cy=Y(cr.top+cr.height/2), a1,a2;
      if(isPred){a1=nLeft?X(nr.right):X(nr.left);a2=nLeft?X(cr.left):X(cr.right);}else{a1=nLeft?X(cr.left):X(cr.right);a2=nLeft?X(nr.right):X(nr.left);}
      var y1b=isPred?ny:cy, y2b=isPred?cy:ny, mx=(a1+a2)/2;
      d='M'+a1+' '+y1b+' C'+mx+' '+y1b+','+mx+' '+y2b+','+(a2+(a2>a1?-7:7))+' '+y2b;
    }
    out+='<path class="'+cls+'" d="'+d+'" marker-end="url(#ah-'+cls.split(' ')[0]+')"/>';
  }
  var css=getComputedStyle(document.documentElement);
  var defs='<defs>'+['fs','ss','ff','sf','crit'].map(function(k){var col=css.getPropertyValue(k==='crit'?'--crit':'--r-'+k).trim();return '<marker id="ah-'+k+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="'+col+'"/></marker>'}).join('')+'</defs>';
  P[cur].forEach(function(r){var el=document.querySelector('#preds [data-k="'+r[0]+'"]');if(el){var ty=parse(pick(r)).ty.toLowerCase();path(el.getBoundingClientRect(),true,(r[3]?'crit ':ty+' ')+'w')}});
  N[cur].forEach(function(r){var el=document.querySelector('#succs [data-k="'+r[1]+'"]');if(el){var ty=parse(pick(r)).ty.toLowerCase();path(el.getBoundingClientRect(),false,(r[3]?'crit ':ty+' ')+'w')}});
  svg.innerHTML=defs+out;
}
function renderNotes(){
  $('tys').innerHTML=t('tys').map(function(x){return '<div class="panel lg-ty"><div class="lg-tyd" aria-hidden="true">'+tyDiagram(x[0])+'</div><h3><b dir="ltr" class="lg-tyk '+x[0].toLowerCase()+'">'+x[0]+'</b> '+esc(x[1])+'</h3><p>'+esc(x[2])+'</p></div>'}).join('');
  $('rus').innerHTML=t('rus').map(function(m,i){return '<div class="panel"><div class="no2">0'+(i+1)+'</div><h3>'+esc(m[0])+'</h3><p>'+esc(m[1])+'</p></div>'}).join('');
  $('src').innerHTML=[['Al Habtoor Engineering, Planning Department','Building Services Planning Manual (2007): MEP and civil interface tables with min, average and max lags','دليل تخطيط أعمال الخدمات (2007): جداول واجهة أعمال MEP مع المدني بـ Lag أقل ومتوسط وأقصى'],['Ahmed Heshmat · Khamsa Planning','Relationships library: site sequence from blockwork to handover','مكتبة العلاقات: التسلسل في الموقع من البلوك للتسليم']].map(function(s){return '<li><b>'+esc(s[0])+'</b> · '+esc(S.lang==='ar'?s[2]:s[1])+'</li>'}).join('');
}
/* small bar diagram for each relationship type */
function tyDiagram(k){
  var A1={x:14,w:90},B1;
  if(k==='FS')B1={x:104,w:80};if(k==='SS')B1={x:44,w:110};if(k==='FF')B1={x:50,w:74};if(k==='SF')B1={x:4,w:50};
  if(k==='SF')A1={x:54,w:120};
  var ax,ay=24,bx,by=58;
  if(k==='FS'){ax=A1.x+A1.w;bx=B1.x}
  if(k==='SS'){ax=A1.x;bx=B1.x}
  if(k==='FF'){ax=A1.x+A1.w;bx=B1.x+B1.w}
  if(k==='SF'){ax=A1.x;bx=B1.x+B1.w}
  var cls=k.toLowerCase();
  return '<svg viewBox="0 0 200 80"><rect x="'+A1.x+'" y="12" width="'+A1.w+'" height="22" rx="4" class="tyA"/><rect x="'+B1.x+'" y="46" width="'+B1.w+'" height="22" rx="4" class="tyB '+cls+'"/>'+
   '<path d="M'+ax+' '+(ay+10)+' C'+ax+' 44,'+bx+' 40,'+bx+' '+(by-14)+'" class="tyL '+cls+'" marker-end="url(#ty-'+cls+')"/>'+
   '<defs><marker id="ty-'+cls+'" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="tyM '+cls+'"/></marker></defs>'+
   '<text x="'+(A1.x+8)+'" y="27">A</text><text x="'+(B1.x+8)+'" y="61">B</text></svg>';
}
function render(){renderStages();renderSide();renderMain();renderNotes()}

/* ---------- events ---------- */
function go(c,scroll){if(!byId[c])return;cur=c;try{history.replaceState(null,'','#'+c)}catch(e){}renderStages();renderList();renderMain();
  if(scroll&&window.innerWidth<900){$('main').scrollIntoView({behavior:'smooth',block:'start'})}
  var on=document.querySelector('#list .lg-item.on'); if(on&&on.scrollIntoView){var l=$('list');if(on.offsetTop<l.scrollTop||on.offsetTop>l.scrollTop+l.clientHeight-40)l.scrollTop=on.offsetTop-l.clientHeight/2}}
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'); if(g){go(g.getAttribute('data-go'),!!e.target.closest('#list'));if(e.target.closest('#main'))$('net').scrollIntoView({behavior:'smooth',block:'nearest'});return}
  var s=e.target.closest('[data-st]'); if(s){fSt=s.getAttribute('data-st'); if(fSt&&byId[cur].st!==fSt){var f=A.filter(function(a){return a[1]===fSt})[0];if(f){cur=f[0];try{history.replaceState(null,'','#'+cur)}catch(e2){}}} renderStages();renderList();renderMain();return}
  var d=e.target.closest('[data-ds]'); if(d){fDs=d.getAttribute('data-ds');renderSide();return}
  var m=e.target.closest('[data-m]'); if(m){mode=+m.getAttribute('data-m');renderSide();renderMain();return}
});
$('q').addEventListener('input',function(){q=this.value;renderList()});
$('q').addEventListener('keydown',function(e){if(e.key==='Enter'){var f=document.querySelector('#list .lg-item');if(f)go(f.getAttribute('data-go'),true)}});
window.addEventListener('resize',function(){requestAnimationFrame(wires)});
window.addEventListener('hashchange',function(){var c=location.hash.slice(1).toUpperCase();if(byId[c]&&c!==cur)go(c)});

function toast(msg){var el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},2600)}
function rowsFor(list){return list.map(function(r){var p=parse(pick(r));return [r[0],nm(r[0]),r[1],nm(r[1]),p.ty,'PR_'+p.ty,p.u==='d'||!p.u?p.n:'',p.lag,r[3]?t('crit'):'',S.lang==='ar'?r[5]:r[4]]})}
var HEAD=['Pred ID','Predecessor','Succ ID','Successor','Type','P6 type','Lag (d)','Lag','Critical','Why'];
$('copy').addEventListener('click',function(){
  var txt=[HEAD].concat(rowsFor(P[cur].concat(N[cur]))).map(function(r){return r.join('\t')}).join('\n');
  function ok(){toast(t('copied'))}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){fallback(txt);ok()})}else{fallback(txt);ok()}
});
function fallback(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta)}
$('csv').addEventListener('click',function(){
  function q2(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  var rows=[HEAD.concat(['Stage (pred)','Stage (succ)'])].concat(rowsFor(R).map(function(row,i){return row.concat([stName(byId[R[i][0]].st),stName(byId[R[i][1]].st)])}));
  var blob=new Blob(['﻿'+rows.map(function(r){return r.map(q2).join(',')}).join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='activity-relationships-'+S.lang+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
});

S.init({T:T,title:{en:'Relationships library',ar:'مكتبة العلاقات'},render:render});
})();
</script>
