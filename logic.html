/* connector lines between nodes and the center card */
function wires(){
  var svg=$('wires'), box=$('net').getBoundingClientRect(), c=$('ctr'); if(!c)return;
  var cr=c.getBoundingClientRect(), out='';
  svg.setAttribute('width',box.width); svg.setAttribute('height',box.height); svg.setAttribute('viewBox','0 0 '+box.width+' '+box.height);
  function X(v){return v-box.left} function Y(v){return v-box.top}
  function path(nr,isPred,cls){
    var stacked=nr.right>cr.left+4&&nr.left<cr.right-4, d;
    if(stacked){ /* mobile: vertical */
      var x1=X(nr.left+nr.width/2), x2=X(cr.left+cr.width/2), y1,y2;
      if(isPred){y1=Y(nr.bottom);y2=Y(cr.top)}else{y1=Y(cr.bottom);y2=Y(nr.top)}
      var my=(y1+y2)/2; d='M'+x1+' '+y1+' C'+x1+' '+my+','+x2+' '+my+','+x2+' '+(y2-7);
    }else{
      var nLeft=nr.right<=cr.left+4, ny=Y(nr.top+Math.min(nr.height/2,34)), cy=Y(cr.top+cr.height/2), a1,a2;
      if(isPred){a1=nLeft?X(nr.right):X(nr.left);a2=nLeft?X(cr.left):X(cr.right);}else{a1=nLeft?X(cr.left):X(cr.right);a2=nLeft?X(nr.right):X(nr.left);}
      var y1b=isPred?ny:cy, y2b=isPred?cy:ny, mx=(a1+a2)/2;
      d='M'+a1+' '+y1b+' C'+mx+' '+y1b+','+mx+' '+y2b+','+(a2+(a2>a1?-7:7))+' '+y2b;
    }
    out+='<path class="'+cls+'" d="'+d+'" marker-end="url(#ah-'+cls.split(' ')[0]+')"/>';
  }
  var css=getComputedStyle(document.documentElement);
  var defs='<defs>'+['fs','ss','ff','sf','crit'].map(function(k){var col=css.getPropertyValue(k==='crit'?'--crit':'--r-'+k).trim();return '<marker id="ah-'+k+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="'+col+'"/></marker>'}).join('')+'</defs>';
  P[cur].forEach(function(r){var el=document.querySelector('#preds [data-k="'+r[0]+'"]');if(el){var ty=parse(pick(r)).ty.toLowerCase();path(el.getBoundingClientRect(),true,(r[3]?'crit ':ty+' ')+'w')}});
  N[cur].forEach(function(r){var el=document.querySelector('#succs [data-k="'+r[1]+'"]');if(el){var ty=parse(pick(r)).ty.toLowerCase();path(el.getBoundingClientRect(),false,(r[3]?'crit ':ty+' ')+'w')}});
  svg.innerHTML=defs+out;
}

  return L.join('\r\n')+'\r\n';
}
function download(txt,fname,type){var blob=new Blob([txt],{type:type});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- events ---------- */
function go(c,scroll){if(!byId[c])return;cur=c;try{history.replaceState(null,'','#'+c)}catch(e){}renderStages();renderList();renderMain();markFrag();
  if(scroll&&window.innerWidth<900){$('main').scrollIntoView({behavior:'smooth',block:'start'})}
  var on=document.querySelector('#list .lg-item.on'); if(on&&on.scrollIntoView){var l=$('list');if(on.offsetTop<l.scrollTop||on.offsetTop>l.scrollTop+l.clientHeight-40)l.scrollTop=on.offsetTop-l.clientHeight/2}}
document.addEventListener('click',function(e){
  var ad=e.target.closest('[data-add]'); if(ad){var c=ad.getAttribute('data-add');if(sel[c])delete sel[c];else sel[c]=1;renderFrag();renderMain();return}
  var rm=e.target.closest('[data-rm]'); if(rm){delete sel[rm.getAttribute('data-rm')];renderFrag();renderMain();return}
  var pr=e.target.closest('[data-pre]'); if(pr){var k=pr.getAttribute('data-pre');setSel(k==='@all'?A.map(function(a){return a[0]}):k==='@stage'?stageCodes([byId[cur].st]):stageCodes(k.split('+')));return}
  var g=e.target.closest('[data-go]'); if(g){go(g.getAttribute('data-go'),!!e.target.closest('#list'));if(e.target.closest('#main'))$('net').scrollIntoView({behavior:'smooth',block:'nearest'});return}
  var s=e.target.closest('[data-st]'); if(s){fSt=s.getAttribute('data-st'); if(fSt&&byId[cur].st!==fSt){var f=A.filter(function(a){return a[1]===fSt})[0];if(f){cur=f[0];try{history.replaceState(null,'','#'+cur)}catch(e2){}}} renderStages();renderList();renderMain();return}
  var d=e.target.closest('[data-ds]'); if(d){fDs=d.getAttribute('data-ds');renderSide();return}
  var m=e.target.closest('[data-m]'); if(m){mode=+m.getAttribute('data-m');renderSide();renderMain();return}
});
$('q').addEventListener('input',function(){q=this.value;renderList()});
$('q').addEventListener('keydown',function(e){if(e.key==='Enter'){var f=document.querySelector('#list .lg-item');if(f)go(f.getAttribute('data-go'),true)}});
window.addEventListener('resize',function(){requestAnimationFrame(wires);clearTimeout(window._frT);window._frT=setTimeout(renderFrag,200)});
window.addEventListener('hashchange',function(){var c=location.hash.slice(1).toUpperCase();if(byId[c]&&c!==cur)go(c)});

function toast(msg){var el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},2600)}
function rowsFor(list){return list.map(function(r){var p=parse(pick(r));return [r[0],nm(r[0]),r[1],nm(r[1]),p.ty,'PR_'+p.ty,p.u==='d'||!p.u?p.n:'',p.lag,r[3]?t('crit'):'',S.lang==='ar'?r[5]:r[4]]})}
var HEAD=['Pred ID','Predecessor','Succ ID','Successor','Type','P6 type','Lag (d)','Lag','Critical','Why'];
$('copy').addEventListener('click',function(){
  var txt=[HEAD].concat(rowsFor(P[cur].concat(N[cur]))).map(function(r){return r.join('\t')}).join('\n');
  function ok(){toast(t('copied'))}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){fallback(txt);ok()})}else{fallback(txt);ok()}
});
function fallback(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta)}
$('frClear').addEventListener('click',function(){setSel([])});
$('frXer').addEventListener('click',function(){var c=selCodes();if(!c.length)return;download(xer(c,'FRAGNET'),'fragnet-'+c.length+'-activities.xer','application/octet-stream');toast(t('xerNote'))});
$('xerAll').addEventListener('click',function(){download(xer(A.map(function(a){return a[0]}),'RELLIB'),'activity-relationships-library.xer','application/octet-stream');toast(t('xerNote'))});
$('frCsv').addEventListener('click',function(){var c=selCodes();if(!c.length)return;var inS={};c.forEach(function(x){inS[x]=1});csvOf(R.filter(function(r){return inS[r[0]]&&inS[r[1]]}),'fragnet-relationships-'+S.lang+'.csv')});
$('csv').addEventListener('click',function(){csvOf(R,'activity-relationships-'+S.lang+'.csv')});
function csvOf(list,fname){
  function q2(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  var rows=[HEAD.concat(['Stage (pred)','Stage (succ)'])].concat(rowsFor(list).map(function(row,k){return row.concat([stName(byId[list[k][0]].st),stName(byId[list[k][1]].st)])}));
  download('\ufeff'+rows.map(function(r){return r.map(q2).join(',')}).join('\r\n'),fname,'text/csv;charset=utf-8');
}
