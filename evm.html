<script src="assets/site.js?v=19"></script>
<script>
(function(){
"use strict";
var S=window.Site, $=S.$, esc=S.esc, t=S.t;
var T={
en:{evmT:'Earned value lab', evmP:'Drag the sliders to set a project\'s status. The S-curve, indices and forecast update live, the way I report them every month.',
 inBac:'Budget at completion (BAC)', inTime:'Time elapsed', inEv:'Work actually done', inAc:'Money actually spent', unit:'مليون', dataDate:'تاريخ البيانات',
 evmHint:'PV follows a typical S-curve. EV and AC are shares of BAC.',
 presets:[['ok','On track'],['late','Behind schedule'],['over','Over budget'],['bad','Recovery needed']],
 vGood:'Ahead of schedule and under budget. Keep the baseline and protect the float.',
 vLate:'Behind schedule. Time for a recovery schedule: re-sequence work and add resources on the critical path.',
 vOver:'Over budget. Review purchase orders against the BOQ and tighten the cost-to-complete.',
 vBad:'Behind schedule and over budget. Escalate to management with a recovery plan and a revised EAC.',
 gT:'How to read it',
 gl:[['PV · Planned value','The budgeted cost of the work that should be done by the data date.'],['EV · Earned value','The budgeted cost of the work actually done.'],['AC · Actual cost','What the work done actually cost.'],['SPI = EV / PV','Below 1.00 means the project is behind schedule.'],['CPI = EV / AC','Below 1.00 means each unit of work costs more than planned.'],['EAC = BAC / CPI','The forecast final cost if the current cost efficiency continues.']],
 goDelay:'Next: delay analysis lab →', goContact:'Contact me'},
ar:{evmT:'أداة القيمة المكتسبة', evmP:'حرّك الأرقام وشوف حالة المشروع. منحنى S والمؤشرات والتوقعات بتتغير على طول، بنفس طريقة تقاريري الشهرية.',
 inBac:'الميزانية عند الإنجاز (BAC)', inTime:'المدة المنقضية', inEv:'الأعمال المنفذة فعليًا', inAc:'المصروف فعليًا', unit:'مليون', dataDate:'تاريخ البيانات',
 evmHint:'القيمة المخططة PV تتبع منحنى S نموذجي. EV و AC نسب من BAC.',
 presets:[['ok','في المسار'],['late','متأخر'],['over','تجاوز الميزانية'],['bad','محتاج خطة تعويض']],
 vGood:'متقدم عن البرنامج وأقل من الميزانية. كمّل بنفس الطريقة وحافظ على الفائض الزمني.',
 vLate:'متأخر عن البرنامج. محتاج خطة تعويض تأخير: غيّر ترتيب الأعمال وزوّد الموارد على المسار الحرج.',
 vOver:'تجاوز الميزانية. راجع أوامر الشراء مقابل جدول الكميات وحدّث تقدير التكلفة النهائية.',
 vBad:'متأخر ومتجاوز للميزانية. بلّغ الإدارة بخطة تعويض وتقدير محدّث للتكلفة النهائية.',
 gT:'إزاي تقرأ النتائج',
 gl:[['PV · القيمة المخططة','التكلفة المعتمدة للأعمال المفروض تكون اتنفذت حتى تاريخ البيانات.'],['EV · القيمة المكتسبة','التكلفة المعتمدة للأعمال اللي اتنفذت فعلًا.'],['AC · التكلفة الفعلية','اللي اتصرف فعلًا على الأعمال المنفذة.'],['SPI = EV / PV','أقل من 1.00 يعني المشروع متأخر عن البرنامج.'],['CPI = EV / AC','أقل من 1.00 يعني كل وحدة شغل بتتكلف أكتر من المخطط.'],['EAC = BAC / CPI','التكلفة النهائية المتوقعة لو استمرت كفاءة التكلفة الحالية.']],
 goDelay:'← التالي: أداة تحليل التأخير', goContact:'تواصل معي'}};

function S_(x){var k=9,f=function(v){return 1/(1+Math.exp(-k*(v-.5)))};return (f(x)-f(0))/(f(1)-f(0))}
var presetVals={ok:[50,52,48],late:[60,42,43],over:[50,50,63],bad:[70,48,70]}, curPreset='ok';
function money(v){return (Math.round(v*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+t('unit')}
function renderPresets(){$('presets').innerHTML=t('presets').map(function(p){return '<button type="button" class="pill'+(curPreset===p[0]?' on':'')+'" data-p="'+p[0]+'">'+p[1]+'</button>'}).join('')}
$('presets').addEventListener('click',function(ev){var b=ev.target.closest('[data-p]');if(!b)return;curPreset=b.getAttribute('data-p');var v=presetVals[curPreset];$('time').value=v[0];$('ev').value=v[1];$('ac').value=v[2];renderPresets();renderEVM()});
['bac','time','ev','ac'].forEach(function(id){$(id).addEventListener('input',function(){if(id!=='bac'&&curPreset){curPreset=null;renderPresets()}renderEVM()})});
function renderEVM(){
  var bac=+$('bac').value, tt=+$('time').value/100, e=+$('ev').value/100, a=+$('ac').value/100;
  var pvP=S_(tt), PV=bac*pvP, EV=bac*e, AC=bac*a;
  var SPI=PV?EV/PV:0, CPI=AC?EV/AC:(EV?9.99:1), EAC=CPI>0?bac/CPI:bac*3, SV=EV-PV, CV=EV-AC;
  $('oBac').textContent=money(bac); $('oTime').textContent=Math.round(tt*100)+'%'; $('oEv').textContent=Math.round(e*100)+'%'; $('oAc').textContent=Math.round(a*100)+'%';
  var W=640,H=300,L=46,R=14,TP=18,B=30, eacShow=Math.min(EAC,bac*2.4), ymax=Math.max(bac*1.12,eacShow*1.08,AC*1.08);
  function X(x){return L+x*(W-L-R)} function Y(v){return H-B-(v/ymax)*(H-TP-B)}
  function path(fn,from,to){var d='',n=48;for(var i=0;i<=n;i++){var x=from+(to-from)*i/n;d+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(fn(x)).toFixed(1)}return d}
  var re=pvP?e/pvP:0, ra=pvP?a/pvP:0, g='', i;
  for(i=0;i<=4;i++){var v=ymax*i/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" font-family="JetBrains Mono" fill="var(--muted)">'+Math.round(v)+'</text>'}
  for(i=0;i<=10;i+=2)g+='<text x="'+X(i/10)+'" y="'+(H-B+16)+'" text-anchor="middle" font-size="10" font-family="JetBrains Mono" fill="var(--muted)">'+(i*10)+'%</text>';
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(bac)+'" y2="'+Y(bac)+'" stroke="var(--ink)" stroke-dasharray="2 3" opacity=".45"/><text x="'+(W-R-4)+'" y="'+(Y(bac)-5)+'" text-anchor="end" font-size="10" font-family="JetBrains Mono" fill="var(--muted)">BAC '+money(bac)+'</text>';
  g+='<line x1="'+X(tt)+'" x2="'+(W-R)+'" y1="'+Y(eacShow)+'" y2="'+Y(eacShow)+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="'+(W-R-4)+'" y="'+(Y(eacShow)+(eacShow>bac?-5:13))+'" text-anchor="end" font-size="10" font-weight="600" font-family="JetBrains Mono" fill="var(--warn)">EAC '+money(EAC)+'</text>';
  g+='<path d="'+path(function(x){return bac*S_(x)},0,tt)+'" fill="none" stroke="var(--muted)" stroke-width="2.5"/>';
  g+='<path d="'+path(function(x){return bac*S_(x)},tt,1)+'" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5" opacity=".6"/>';
  g+='<path d="'+path(function(x){return bac*S_(x)*ra},0,tt)+'" fill="none" stroke="var(--crit)" stroke-width="3" stroke-linejoin="round"/>';
  g+='<path d="'+path(function(x){return bac*S_(x)*re},0,tt)+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>';
  g+='<line x1="'+X(tt)+'" x2="'+X(tt)+'" y1="'+TP+'" y2="'+(H-B)+'" stroke="var(--ink)" stroke-width="1.2"/><text x="'+(X(tt)+(tt>.75?-5:5))+'" y="'+(TP+2)+'" text-anchor="'+(tt>.75?'end':'start')+'" font-size="10" font-family="JetBrains Mono" fill="var(--ink)">'+t('dataDate')+'</text>';
  [[PV,'var(--muted)'],[AC,'var(--crit)'],[EV,'var(--accent)']].forEach(function(p){g+='<circle cx="'+X(tt).toFixed(1)+'" cy="'+Y(p[0]).toFixed(1)+'" r="5" fill="'+p[1]+'" stroke="var(--surface)" stroke-width="2"/>'});
  $('evmChart').innerHTML=g;
  function k(lbl,val,good){return '<div class="kpi'+(good===null?'':(good?' good':' bad'))+'"><small>'+lbl+'</small><b>'+val+'</b></div>'}
  $('kpis').innerHTML=k('PV',money(PV),null)+k('EV',money(EV),null)+k('AC',money(AC),null)+k('EAC',money(EAC),EAC<=bac)+
    k('SV',(SV>=0?'+':'')+money(SV),SV>=0)+k('CV',(CV>=0?'+':'')+money(CV),CV>=0)+k('SPI',SPI.toFixed(2),SPI>=1)+k('CPI',CPI.toFixed(2),CPI>=1);
  var sOk=SPI>=1, cOk=CPI>=1, v=$('verdict');
  v.className='verdict '+(sOk&&cOk?'good':(!sOk&&!cOk?'bad':'mix'));
  v.textContent=sOk&&cOk?t('vGood'):(!sOk&&!cOk?t('vBad'):(!sOk?t('vLate'):t('vOver')));
}
function renderGloss(){$('gloss').innerHTML=t('gl').map(function(g){return '<div class="panel"><h3 class="mono" style="font-size:.95rem;color:var(--accent)">'+esc(g[0])+'</h3><p>'+esc(g[1])+'</p></div>'}).join('')}
S.init({T:T,title:{en:'EVM lab',ar:'أداة EVM'},render:function(){renderPresets();renderEVM();renderGloss()}});
})();
</script>
<script data-goatcounter="https://3okail-blueprint.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
