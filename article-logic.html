(function(){"use strict";var S=window.Site;
var T={"en": {"aT": "Activity relationships: how to build schedule logic that tells the truth", "aBody": "<p>A schedule is only as good as its logic. Durations get debated in every meeting, but the relationships between activities decide which work is critical, where the float sits, and whether a delay event moves the finish date at all. Weak logic gives a schedule that looks fine on day one and stops telling the truth by the first update. I built the <a href=\"logic.html\">activity relationships library</a> to keep good site logic in one place. This article explains the thinking behind it and how to use it.</p>\n<h2>1. Start from the site, not from the software</h2>\n<p>Every relationship should answer one question: why can this activity not start (or finish) earlier? Plaster waits for the conduits because they are buried in the wall. Blockwork waits for formwork striking because the floor must be clear of props. The gypsum ceiling waits for the pressure tests because nobody closes over untested pipes. If you can say the reason in one sentence, the link is real. If you cannot, it is probably a preference, and it belongs in a note, not in the logic.</p>\n<h2>2. Use the four types on purpose</h2>\n<ul>\n<li><b>FS (finish to start)</b> is the default. On a healthy schedule, around 90% of links are FS.</li>\n<li><b>SS (start to start) with a lag</b> models work that rolls zone by zone: conduits a few days behind the blockwork, insulation behind the pipework.</li>\n<li><b>FF (finish to finish)</b> keeps the follower from finishing before the leader. Pair it with an SS, or the follower's start is left open.</li>\n<li><b>SF (start to finish)</b> is very rare. If you find one in a schedule, ask why.</li>\n</ul>\n<h2>3. A lag is a hidden activity</h2>\n<p>Seven days of curing, 48 hours of flood test, two weeks before the slab can be struck: each lag is time the schedule spends without showing what happens. Keep lags for physical waiting, write the reason in the notes, and turn anything long or important into a real activity. The DCMA 14-point check expects lags on less than 5% of relationships and no leads (negative lags) at all.</p>\n<h2>4. Pick the option that matches your float</h2>\n<p>Many links have more than one honest answer. Conduits can follow the blockwork by SS +2 days when the crews are ready and the floor is open, by SS +5 when it is crowded, or by FS when there is float to spare. The library shows three options for these links: <b>fast</b>, <b>medium</b> and <b>relaxed</b>. Choose by the float you have and how busy the floor is, not by habit.</p>\n<h2>5. Tests and inspections are activities</h2>\n<p>A pressure test, a flood test or a consultant's inspection takes time and can fail. As a zero-duration milestone, it tells P6 that the next trade can start the same day, which is rarely true. Give it a duration, and let it act as the gate it is on site.</p>\n<h2>6. Split the activity to fit the logic</h2>\n<p>When a link only works for part of an activity, split the activity. Sprinkler drops go in before the ceiling is closed, and the heads go in after it, so \"sprinklers\" becomes two activities. Bathrooms run floor by floor, so link them per floor or per zone. Otherwise the lag loses its meaning and the dates lose their credibility.</p>\n<h2>7. How to use the library</h2>\n<ul>\n<li><b>Pick an activity</b> from the list, or search for it. You see what must come before it, what follows it, the type and lag of each link, and the reason on site.</li>\n<li><b>Switch the lag option</b> (fast, medium, relaxed) to see how the logic tightens or relaxes.</li>\n<li><b>Follow the workflow</b> of its stage, from approvals and substructure to handover, and jump between activities.</li>\n<li><b>Build a fragnet:</b> add activities, or start from a preset such as bathrooms and ceilings. The page draws the network between them and runs a logic check: open starts and ends, FF-only starts, SS-only finishes, lags, FS share and long lags.</li>\n<li><b>Download the XER</b>, import it into Primavera P6 and press F9. The file carries the activities, typical durations, a 6-day calendar and every relationship with its lag and reason.</li>\n</ul>\n<h2>Limits</h2>\n<p>The durations are typical values per floor or zone, and the logic reflects towers and hotels I have worked on and two good references: the Al Habtoor Building Services Planning Manual and the Khamsa Planning relationships library. Every project is different. Your approved specifications, drawings and method statements always govern, so treat the library as a starting point to check, not a schedule to copy.</p>", "meta": "Scheduling", "read": "min read", "by": "Ahmed AbuOkail", "all": "← All articles", "next": "Next article", "nT": "Time Impact Analysis, step by step: how to prove an EOT", "contact": "Questions about your project? Contact me", "tryLib": "Open the relationships library →"}, "ar": {"aT": "العلاقات بين الأنشطة: إزاي تبني Logic برنامجك يقول الحقيقة", "aBody": "<p>البرنامج الزمني قوته من الـ Logic بتاعه. المدد بتتناقش في كل اجتماع، لكن العلاقات بين الأنشطة هي اللي بتحدد إيه الحرج، والفائض فين، وهل حدث التأخير هيحرّك تاريخ الإنهاء ولا لأ. الـ Logic الضعيف بيدّيك برنامج شكله كويس أول يوم، ويبطّل يقول الحقيقة من أول تحديث. علشان كده عملت <a href=\"logic.html\">مكتبة العلاقات بين الأنشطة</a>، تجمع الـ Logic الصح في مكان واحد. المقال ده بيشرح الفكرة اللي وراها وإزاي تستخدمها.</p>\n<h2>1. ابدأ من الموقع، مش من البرنامج</h2>\n<p>كل علاقة لازم تجاوب على سؤال واحد: ليه النشاط ده مينفعش يبدأ (أو يخلص) بدري؟ المحارة مستنية المواسير لأنها مدفونة في الحيطة. والبلوك مستني فك الشدة لأن الدور لازم يفضى من الدعامات. والسقف الجبس مستني اختبارات الضغط لأن محدش بيقفل على مواسير ما اتختبرتش. لو تقدر تقول السبب في جملة واحدة، العلاقة حقيقية. لو مش قادر، غالبًا دي رغبة مش قيد، ومكانها الـ Notes مش الـ Logic.</p>\n<h2>2. استخدم الأنواع الأربعة عن قصد</h2>\n<ul>\n<li><b>FS (نهاية ← بداية)</b> هي الأساس. في البرنامج السليم حوالي 90% من العلاقات FS.</li>\n<li><b>SS (بداية ← بداية) بـ Lag</b> للشغل اللي بيمشي منطقة منطقة: المواسير ورا البلوك بكام يوم، والعزل ورا المواسير.</li>\n<li><b>FF (نهاية ← نهاية)</b> بتمنع النشاط التاني يخلص قبل الأول. اربطها بـ SS، وإلا بداية النشاط التاني هتفضل مفتوحة.</li>\n<li><b>SF (بداية ← نهاية)</b> نادرة جدًا. لو لقيتها في برنامج، اسأل ليه.</li>\n</ul>\n<h2>3. الـ Lag نشاط مستخبي</h2>\n<p>7 أيام معالجة، و48 ساعة اختبار غمر، وأسبوعين قبل فك شدة السقف: كل Lag وقت البرنامج بيعدّيه من غير ما يبيّن إيه اللي بيحصل فيه. خلي الـ Lags للانتظار الفعلي بس، واكتب السبب في الـ Notes، وأي حاجة طويلة أو مهمة حوّلها لنشاط حقيقي. وفحص الـ DCMA (الـ 14 نقطة) بيتوقع إن الـ Lags تبقى على أقل من 5% من العلاقات، ومفيش Leads (Lag بالسالب) خالص.</p>\n<h2>4. اختار على قد الفائض اللي عندك</h2>\n<p>علاقات كتير ليها أكتر من إجابة صح. مواسير الكهربا ممكن تمشي ورا البلوك بـ SS +2 يوم لو الأطقم جاهزة والدور فاضي، أو بـ SS +5 لو الدور زحمة، أو FS لو عندك فائض. علشان كده المكتبة بتدّيك 3 اختيارات للعلاقات دي: <b>سريع</b> و<b>متوسط</b> و<b>مريح</b>. اختار على حسب الفائض والزحمة في الدور، مش بالعادة.</p>\n<h2>5. الاختبارات والاستلامات أنشطة</h2>\n<p>اختبار الضغط أو اختبار الغمر أو استلام الاستشاري بياخد وقت، وممكن يفشل. لو خليته Milestone بمدة صفر، البرنامج هيفترض إن اللي بعده يبدأ في نفس اليوم، ودي نادرًا ما بتحصل. ادّيله مدة، وخليه بوابة زي ما هو في الموقع.</p>\n<h2>6. قسّم النشاط على قد العلاقة</h2>\n<p>لو العلاقة بتنطبق على جزء من النشاط بس، قسّم النشاط. نزلات الرشاشات بتتركب قبل قفل السقف، والرؤوس بعده، فـ\"الرشاشات\" تبقى نشاطين. والحمامات بتمشي دور دور، فاربطها بالدور أو بالـ zone. وإلا الـ Lag هيفقد معناه، والتواريخ هتفقد مصداقيتها.</p>\n<h2>7. إزاي تستخدم المكتبة</h2>\n<ul>\n<li><b>اختار نشاط</b> من القايمة أو دوّر عليه. هتشوف اللي لازم قبله، واللي بعده، ونوع كل علاقة والـ Lag بتاعها، والسبب من الموقع.</li>\n<li><b>غيّر اختيار الـ Lag</b> (سريع، متوسط، مريح) وشوف الـ Logic بيضيق أو يوسع إزاي.</li>\n<li><b>امشي مع الـ Workflow</b> بتاع المرحلة، من الاعتمادات والأساسات لحد التسليم، واتنقل بين الأنشطة.</li>\n<li><b>ابني Fragnet:</b> ضيف أنشطة، أو ابدأ من اختيار جاهز زي الحمامات والسقف. الصفحة بترسم الشبكة اللي بينهم وبتعمل فحص للـ Logic: البدايات والنهايات المفتوحة، والبداية اللي ماسكاها FF بس، والنهاية اللي ماسكاها SS بس، والـ Lags، ونسبة الـ FS، والـ Lags الطويلة.</li>\n<li><b>نزّل ملف XER</b> واعمله Import في Primavera P6 واضغط F9. الملف فيه الأنشطة والمدد المعتادة وتقويم 6 أيام وكل العلاقات بالـ Lag والسبب.</li>\n</ul>\n<h2>حدود المكتبة</h2>\n<p>المدد قيم معتادة للدور أو المنطقة، والـ Logic معمول من أبراج وفنادق اشتغلت عليها ومن مرجعين كويسين: دليل تخطيط أعمال الخدمات من الحبتور، ومكتبة العلاقات من خمسة بلاننج. كل مشروع مختلف، والمواصفات والرسومات وطرق التنفيذ المعتمدة في مشروعك هي اللي بتحكم. فاعتبر المكتبة نقطة بداية تراجعها، مش برنامج تنسخه.</p>", "meta": "الجدولة", "read": "دقائق قراءة", "by": "أحمد أبوعقيل", "all": "→ كل المقالات", "next": "المقال التالي", "nT": "تحليل الأثر الزمني خطوة بخطوة: إزاي تثبت استحقاق تمديد المدة", "contact": "عندك سؤال عن مشروعك؟ تواصل معي", "tryLib": "← افتح مكتبة العلاقات"}};
S.init({T:T,title:{en:"Activity relationships: schedule logic that tells the truth",ar:"العلاقات بين الأنشطة: Logic برنامجك"}});})();
</script>
